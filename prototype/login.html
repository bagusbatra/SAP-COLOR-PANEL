<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login &mdash; Color Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="login-layout">

<div class="login-card">

  <div class="login-header">
    <div class="login-brand-icon">
      <i class="fa-solid fa-palette"></i>
    </div>
    <h1 class="login-title">Color Panel</h1>
    <p class="login-subtitle">PT. Kayu Mebel Indonesia</p>
  </div>

  <div class="login-body">

    <div class="form-group">
      <label class="form-label form-label-required" for="userId">User ID</label>
      <input type="text" id="userId" class="form-control" placeholder="Contoh: admin01" autocomplete="username">
    </div>

    <div class="form-group">
      <label class="form-label form-label-required" for="password">Password</label>
      <input type="password" id="password" class="form-control" placeholder="Password" autocomplete="current-password">
    </div>

    <button id="btnLogin" class="btn btn-primary btn-lg" style="width:100%;">
      <i class="fa-solid fa-right-to-bracket"></i>
      <span>Masuk</span>
    </button>

    <div class="login-hint">
      <div class="login-hint-title">
        <i class="fa-solid fa-circle-info"></i> Akun Demo
      </div>
      <div>Klik untuk auto-fill:</div>
      <div class="mt-2" style="display:flex;flex-wrap:wrap;gap:6px;">
        <code onclick="fill('sales01')">sales01</code>
        <code onclick="fill('admin01')">admin01</code>
        <code onclick="fill('qc01')">qc01</code>
        <code onclick="fill('it01')">it01</code>
      </div>
      <div class="mt-2 text-muted">Password sama dengan User ID</div>
    </div>

  </div>

</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/auth.js"></script>
<script>
  /* Kalau sudah login, langsung redirect */
  if (Auth.isLoggedIn()) {
    window.location.href = Auth.getLandingPage();
  }

  function fill(userId) {
    Utils.el('userId').value = userId;
    Utils.el('password').value = userId;
    Utils.el('password').focus();
  }

  function doLogin() {
    const userId = Utils.el('userId').value.trim();
    const password = Utils.el('password').value;

    if (!userId || !password) {
      Utils.toastWarning('User ID dan Password wajib diisi');
      return;
    }

    const res = Auth.login(userId, password);
    if (!res.ok) {
      Utils.alertError('Login Gagal', res.msg);
      return;
    }

    Utils.toastSuccess(`Selamat datang, ${res.session.full_name}!`);
    setTimeout(() => {
      window.location.href = Auth.getLandingPage();
    }, 600);
  }

  Utils.el('btnLogin').addEventListener('click', doLogin);
  Utils.el('password').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') doLogin();
  });
  Utils.el('userId').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') Utils.el('password').focus();
  });
</script>

</body>
</html>
