<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCP Detail &mdash; Color Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(15,23,42,0.5);
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-box {
    background: #fff; border-radius: 12px;
    max-width: 640px; width: 100%; max-height: 90vh;
    overflow: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .modal-header { padding: 16px 24px; border-bottom: 1px solid var(--color-gray-200);
    display: flex; justify-content: space-between; align-items: center; }
  .modal-body { padding: 24px; }
  .modal-footer { padding: 16px 24px; border-top: 1px solid var(--color-gray-200);
    background: var(--color-gray-50); display: flex; justify-content: flex-end; gap: 8px; }
  .photo-preview-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 8px; margin-top: 8px;
  }
  .photo-preview-item {
    position: relative; aspect-ratio: 1;
    border-radius: 8px; overflow: hidden;
    border: 1px solid var(--color-gray-300);
  }
  .photo-preview-item img { width: 100%; height: 100%; object-fit: cover; }
  .photo-preview-remove {
    position: absolute; top: 4px; right: 4px;
    width: 24px; height: 24px; border-radius: 50%;
    background: rgba(239,68,68,0.9); color: #fff;
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
  }
</style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="page-header" id="page-header"></div>
    <div class="page-content" id="content">
      <div class="table-empty"><i class="fa-solid fa-spinner fa-spin"></i> Memuat MCP...</div>
    </div>
  </main>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/utils.js"></script>
<script src="../assets/js/db.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/biz.js"></script>
<script src="../assets/js/sticker.js"></script>
<script src="../assets/js/sidebar.js"></script>
<script>

let currentMcpId = null;
let currentPanelNumber = null;
let stagedPhotos = [];

if (Auth.guard([ROLES.ADMIN, ROLES.QC, ROLES.IT])) {
  Sidebar.render();
  currentMcpId = Utils.getParam('id');
  if (!currentMcpId) {
    Utils.alertError('Parameter Hilang', 'MCP ID tidak ada').then(() =>
      Utils.redirect('pages/mcp_list.html'));
  } else render();
}

function render() {
  const mcp = DB.find('mcp_headers', 'mcp_id', currentMcpId);
  if (!mcp) {
    Sidebar.renderHeader('MCP Detail', 'Not found');
    Utils.setHtml('content', `
      <div class="empty-state">
        <div class="empty-state-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <div class="empty-state-title">MCP tidak ditemukan</div>
      </div>`);
    return;
  }

  const canEdit = Auth.hasRole(ROLES.ADMIN);
  const isOpen = mcp.status === MCP_HDR_STATUS.OPEN;
  const isRenewed = mcp.is_renewed === 'X';
  const color = DB.find('color_codes', 'color_code', mcp.color_code);
  const items = DB.filter('mcp_items', p => p.mcp_id === currentMcpId)
    .sort((a, b) => a.panel_number - b.panel_number);

  Sidebar.renderHeader(
    `MCP ${mcp.mcp_id}${isRenewed ? ' (Obsolete)' : ''}`,
    `${mcp.color_code} — ${mcp.matnr} — ${DB.getBuyerName(mcp.buyer_id)}`
  );

  let headerActions = `
    <a href="mcp_list.html" class="btn btn-secondary btn-sm">
      <i class="fa-solid fa-arrow-left"></i> Kembali
    </a>
    <button class="btn btn-secondary btn-sm" onclick="printBulkStickers()" title="Cetak semua stiker MCP">
      <i class="fa-solid fa-print"></i> Bulk Stiker
    </button>
  `;

  const approvedCount = items.filter(p => p.status === MCP_PANEL_STATUS.APPROVED).length;
  const canClose = approvedCount >= CONFIG.MIN_APPROVE_MCP_CLOSE;

  if (canEdit && isOpen) {
    headerActions += `
      <button class="btn btn-success btn-sm" onclick="closeHeader()" ${!canClose ? 'disabled' : ''}>
        <i class="fa-solid fa-lock"></i> Close MCP
      </button>
    `;
  }
  Utils.setHtml('page-header-actions', headerActions);

  const today = Utils.today();
  const isExpired = mcp.expire_date && mcp.expire_date < today;
  const daysToExpire = mcp.expire_date ? Utils.daysBetween(today, mcp.expire_date) : null;

  /* QC boleh lihat MCP tapi tidak boleh renewal — jangan tampilkan tombol
     yang ujungnya cuma kena "Akses Ditolak" di mcp_renewal.html */
  const canRenew = Auth.hasAnyRole([ROLES.ADMIN, ROLES.IT]);

  let alertBar = '';
  if (isRenewed) {
    /* Cari MCP baru yang menggantikan */
    const newer = DB.filter('mcp_headers', h => h.parent_mcp_id === mcp.mcp_id)[0];
    alertBar = `<div class="card mb-4" style="background:var(--color-gray-100);border:1px solid var(--color-gray-300);">
      <div class="card-body" style="display:flex;gap:12px;align-items:center;">
        <i class="fa-solid fa-arrows-rotate" style="color:var(--color-gray-600);font-size:20px;"></i>
        <div style="flex:1;">
          <div style="font-weight:700;">MCP ini sudah di-Renewal (Obsolete)</div>
          <div style="font-size:12px;color:var(--color-gray-600);">
            Digantikan oleh
            ${newer
              ? `<a href="mcp_detail.html?id=${encodeURIComponent(newer.mcp_id)}" class="text-mono">${newer.mcp_id}</a>`
              : 'MCP baru'}
            pada ${Utils.formatDate(mcp.renewal_date)}
          </div>
        </div>
      </div></div>`;
  } else if (isOpen && isExpired) {
    alertBar = `<div class="card mb-4" style="background:#FEE2E2;border:1px solid #EF4444;">
      <div class="card-body" style="display:flex;gap:12px;align-items:center;">
        <i class="fa-solid fa-clock" style="color:#991B1B;font-size:20px;"></i>
        <div style="flex:1;">
          <div style="font-weight:700;color:#991B1B;">MCP sudah expired</div>
          <div style="font-size:12px;color:#7F1D1D;">Expired ${Utils.formatDate(mcp.expire_date)}. Segera renewal.</div>
        </div>
        ${canRenew ? `<a href="mcp_renewal.html" class="btn btn-danger btn-sm">
          <i class="fa-solid fa-arrows-rotate"></i> Renewal
        </a>` : ''}
      </div></div>`;
  } else if (mcp.status === MCP_HDR_STATUS.CLOSED && !isExpired && daysToExpire !== null && daysToExpire <= 60) {
    alertBar = `<div class="card mb-4" style="background:#FEF3C7;border:1px solid #F59E0B;">
      <div class="card-body" style="display:flex;gap:12px;align-items:center;">
        <i class="fa-solid fa-hourglass-half" style="color:#78350F;font-size:20px;"></i>
        <div style="flex:1;">
          <div style="font-weight:700;color:#78350F;">MCP akan expired ${daysToExpire} hari lagi</div>
          <div style="font-size:12px;color:#78350F;">Siapkan SO baru untuk renewal.</div>
        </div>
        ${canRenew ? `<a href="mcp_renewal.html" class="btn btn-warning btn-sm">
          <i class="fa-solid fa-arrows-rotate"></i> Renewal
        </a>` : ''}
      </div></div>`;
  }

  let content = `
    ${alertBar}

    <div style="display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:20px;">
      <div class="card">
        <div class="card-header">
          <h3 class="card-title"><i class="fa-solid fa-info-circle"></i> Informasi MCP</h3>
          ${isRenewed
            ? '<span class="badge badge-neutral">Obsolete (Renewed)</span>'
            : Utils.mcpHdrBadge(mcp.status)}
        </div>
        <div class="card-body">
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;">
            <div>
              <div class="text-sm text-muted">Color Code</div>
              <div style="display:flex;align-items:center;gap:6px;">
                <span class="color-swatch" style="background:${color ? color.color_hex : '#E2E8F0'};"></span>
                <span class="text-mono" style="font-weight:600;">${Utils.escapeHtml(mcp.color_code)}</span>
              </div>
            </div>
            <div>
              <div class="text-sm text-muted">Material</div>
              <div class="text-mono text-sm">${Utils.escapeHtml(mcp.matnr)}</div>
              <div class="text-sm text-muted">${Utils.escapeHtml(mcp.maktx || '-')}</div>
            </div>
            <div>
              <div class="text-sm text-muted">Buyer</div>
              <div>${Utils.escapeHtml(DB.getBuyerName(mcp.buyer_id))}</div>
            </div>
            <div>
              <div class="text-sm text-muted">DCP Asal</div>
              <div>${mcp.dcp_id
                ? `<a href="dcp_detail.html?id=${encodeURIComponent(mcp.dcp_id)}" class="text-mono">${Utils.escapeHtml(mcp.dcp_id)}</a>`
                : '<span class="text-muted">(Renewal, tidak lewat DCP)</span>'}</div>
            </div>
            <div>
              <div class="text-sm text-muted">MFG Date</div>
              <div>${mcp.mfg_date ? Utils.formatDate(mcp.mfg_date) : '-'}</div>
            </div>
            <div>
              <div class="text-sm text-muted">Expired</div>
              <div>${mcp.expire_date ? Utils.formatDate(mcp.expire_date) : '-'}</div>
            </div>
            ${mcp.parent_mcp_id ? `
              <div style="grid-column:span 3;">
                <div class="text-sm text-muted">MCP Sebelumnya (Parent)</div>
                <div><a href="mcp_detail.html?id=${encodeURIComponent(mcp.parent_mcp_id)}" class="text-mono">${Utils.escapeHtml(mcp.parent_mcp_id)}</a></div>
              </div>
            ` : ''}
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h3 class="card-title"><i class="fa-solid fa-chart-simple"></i> Progress</h3>
        </div>
        <div class="card-body">
          ${renderProgressBar(items, mcp.qty_total)}
          ${isOpen && canEdit ? `
            <div class="mt-4" style="padding:10px;background:${canClose ? '#D1FAE5' : '#FEF3C7'};border-radius:8px;font-size:12px;">
              ${canClose
                ? `<i class="fa-solid fa-check" style="color:#065F46;"></i> <strong>Siap di-close.</strong> Min ${CONFIG.MIN_APPROVE_MCP_CLOSE} panel approved terpenuhi.`
                : `<i class="fa-solid fa-clock" style="color:#92400E;"></i> Butuh minimal <strong>${CONFIG.MIN_APPROVE_MCP_CLOSE} panel approved</strong> untuk close.`}
            </div>
          ` : ''}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3 class="card-title"><i class="fa-solid fa-th"></i> Panel Grid MCP (${mcp.qty_total} slot)</h3>
        <div class="text-sm text-muted">
          <span style="color:var(--color-gray-500);">BL</span> Blank &middot;
          <span style="color:var(--color-info);">DA</span> DCP-Approved &middot;
          <span style="color:var(--color-warning);">SB</span> Submitted &middot;
          <span style="color:var(--color-success);">AP</span> MCP-Approved &middot;
          <span style="color:var(--color-gray-500);">OB</span> Obsolete
        </div>
      </div>
      <div class="card-body">
        <div class="panel-grid">
          ${items.map(p => renderPanelTile(p, canEdit, isOpen, isRenewed)).join('')}
        </div>
      </div>
    </div>
  `;

  Utils.setHtml('content', content);
}

function renderProgressBar(items, total) {
  const bl = items.filter(p => p.status === MCP_PANEL_STATUS.BLANK).length;
  const da = items.filter(p => p.status === MCP_PANEL_STATUS.DCP_APPROVED).length;
  const sb = items.filter(p => p.status === MCP_PANEL_STATUS.SUBMITTED).length;
  const ap = items.filter(p => p.status === MCP_PANEL_STATUS.APPROVED).length;
  const ob = items.filter(p => p.status === MCP_PANEL_STATUS.OBSOLETE).length;
  const pct = s => total > 0 ? Math.round((s / total) * 100) : 0;

  return `
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px;">
      <span><strong>${ap}</strong> / ${total} approved</span>
      <span class="text-muted">${pct(ap)}%</span>
    </div>
    <div style="height:10px;background:var(--color-gray-200);border-radius:5px;overflow:hidden;display:flex;">
      <div style="background:var(--color-success);width:${pct(ap)}%;"></div>
      <div style="background:var(--color-warning);width:${pct(sb)}%;"></div>
      <div style="background:var(--color-info);width:${pct(da)}%;"></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px;font-size:11px;">
      <div><span class="badge badge-neutral">BL</span> ${bl}</div>
      <div><span class="badge badge-info">DA</span> ${da}</div>
      <div><span class="badge badge-warning">SB</span> ${sb}</div>
      <div><span class="badge badge-success">AP</span> ${ap}</div>
      <div><span class="badge badge-neutral">OB</span> ${ob}</div>
    </div>
  `;
}

function renderPanelTile(p, canEdit, isOpen, isRenewed) {
  const canAction = canEdit && isOpen && !isRenewed;
  const clickAction = canAction ? `onclick="openPanelModal(${p.panel_number})"` : '';
  const photoCount = DB.filter('photos', ph =>
    ph.ref_type === 'MCP' && ph.ref_id === currentMcpId && ph.panel_number === p.panel_number).length;

  return `
    <div class="panel-tile status-${p.status}" ${clickAction} title="${Utils.escapeHtml(p.panel_id)}">
      <div class="panel-tile-number">Slot #${String(p.panel_number).padStart(2, '0')}</div>
      <div class="panel-tile-id">${Utils.escapeHtml(p.panel_id)}</div>
      <div class="panel-tile-status">${Utils.mcpPanelBadge(p.status)}</div>
      ${p.mfg_date ? `<div class="text-sm text-muted mt-2">${Utils.formatDate(p.mfg_date)}</div>` : ''}
      ${photoCount > 0 ? `<div class="text-sm text-muted"><i class="fa-solid fa-image"></i> ${photoCount} foto</div>` : ''}
      ${p.dcp_panel_id ? `<div class="text-sm text-muted" title="Dari DCP"><i class="fa-solid fa-flask"></i> DCP</div>` : ''}
    </div>
  `;
}

/* ============================================================
 * PANEL MODAL
 * ============================================================ */
function openPanelModal(panelNumber) {
  currentPanelNumber = panelNumber;
  stagedPhotos = [];
  const panel = DB.filter('mcp_items', p =>
    p.mcp_id === currentMcpId && p.panel_number === panelNumber)[0];
  if (!panel) return;

  const photos = DB.filter('photos', ph =>
    ph.ref_type === 'MCP' && ph.ref_id === currentMcpId && ph.panel_number === panelNumber);

  let bodyContent = '';
  let footerButtons = `<button class="btn btn-secondary" onclick="closeModal()">Tutup</button>`;

  const showQr = panel.status !== MCP_PANEL_STATUS.BLANK;
  bodyContent += `
    <div style="display:grid;grid-template-columns:${showQr ? '2fr 1fr' : '1fr'};gap:16px;margin-bottom:16px;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div>
          <div class="text-sm text-muted">Panel ID</div>
          <div class="text-mono" style="font-weight:600;">${Utils.escapeHtml(panel.panel_id)}</div>
        </div>
        <div>
          <div class="text-sm text-muted">Status</div>
          <div>${Utils.mcpPanelBadge(panel.status)}</div>
        </div>
        ${panel.dcp_panel_id ? `
          <div>
            <div class="text-sm text-muted">DCP Panel Asal</div>
            <div class="text-mono text-sm">${Utils.escapeHtml(panel.dcp_panel_id)}</div>
          </div>
        ` : ''}
        ${panel.mfg_date ? `
          <div>
            <div class="text-sm text-muted">MFG Date</div>
            <div>${Utils.formatDate(panel.mfg_date)}</div>
          </div>
        ` : ''}
      </div>
      ${showQr ? `
        <div style="text-align:center;">
          <div id="qrPreview" style="display:inline-block;padding:8px;background:#fff;border:1px solid var(--color-gray-300);border-radius:6px;"></div>
          <div class="text-sm text-muted mt-2">QR Panel</div>
          <button class="btn btn-primary btn-sm mt-2" onclick="printSticker()" style="width:100%;">
            <i class="fa-solid fa-print"></i> Cetak Stiker
          </button>
        </div>
      ` : ''}
    </div>
  `;

  if (photos.length > 0) {
    bodyContent += `
      <div style="margin-bottom:16px;">
        <div class="form-label">Foto yang sudah di-upload (${photos.length})</div>
        <div class="photo-preview-grid">
          ${photos.map(p => `
            <div class="photo-preview-item">
              <img src="${p.base64}" alt="${Utils.escapeHtml(p.file_name)}">
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  const canAction = Auth.hasRole(ROLES.ADMIN);
  if (!canAction) {
    bodyContent += `<div class="text-muted text-sm">Hanya ADMIN yang bisa melakukan aksi.</div>`;
  } else if (panel.status === MCP_PANEL_STATUS.BLANK) {
    /* --- START BLANK SLOT --- */
    bodyContent += `
      <div style="padding:12px;background:#DBEAFE;border-radius:8px;font-size:13px;color:#1E40AF;margin-bottom:12px;">
        <i class="fa-solid fa-info-circle"></i>
        Slot ini masih polos. Isi dengan panel baru dari color room, lalu tentukan tanggal produksi.
      </div>
      <div class="form-group">
        <label class="form-label form-label-required">Tanggal Dibuat (MFG Date)</label>
        <input type="date" id="fMfgDate" class="form-control" value="${Utils.today()}">
      </div>
    `;
    footerButtons = `
      <button class="btn btn-secondary" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" onclick="doStartBlank()">
        <i class="fa-solid fa-play"></i> Mulai Slot
      </button>
    `;
  } else if (panel.status === MCP_PANEL_STATUS.DCP_APPROVED) {
    /* --- SUBMIT FOTO --- */
    bodyContent += `
      <div style="padding:12px;background:#DBEAFE;border-radius:8px;font-size:13px;color:#1E40AF;margin-bottom:12px;">
        <i class="fa-solid fa-info-circle"></i>
        Panel siap di-submit sebagai master. Upload min ${CONFIG.MIN_PHOTO_PER_PANEL} foto panel yang sudah bertanda tangan lengkap.
      </div>
      <div class="form-group">
        <label class="form-label form-label-required">Upload Foto (min ${CONFIG.MIN_PHOTO_PER_PANEL})</label>
        <input type="file" id="fPhotos" class="form-control" accept="image/jpeg,image/png,image/jpg" multiple>
        <div class="form-help">JPG/PNG, max ${CONFIG.MAX_PHOTO_SIZE_MB} MB. Akan disimpan ke DMS ZMCP.</div>
      </div>
      <div id="stagedPreview"></div>
    `;
    footerButtons = `
      <button class="btn btn-secondary" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" onclick="doSubmit()">
        <i class="fa-solid fa-paper-plane"></i> Submit
      </button>
    `;
  } else if (panel.status === MCP_PANEL_STATUS.SUBMITTED) {
    /* --- APPROVE / REJECT --- */
    bodyContent += `
      <div style="padding:12px;background:#D1FAE5;border-radius:8px;font-size:13px;color:#065F46;margin-bottom:12px;">
        <i class="fa-solid fa-check-circle"></i>
        Approve = panel resmi menjadi <strong>MCP-APPROVED</strong> (master panel warna hidup).
        Reject akan menghapus foto & kembalikan ke DCP-Approved untuk submit ulang.
      </div>
    `;
    footerButtons = `
      <button class="btn btn-secondary" onclick="closeModal()">Tutup</button>
      <button class="btn btn-danger" onclick="doReject()">
        <i class="fa-solid fa-times"></i> Reject
      </button>
      <button class="btn btn-success" onclick="doApprove()">
        <i class="fa-solid fa-check"></i> Approve
      </button>
    `;
  } else if (panel.status === MCP_PANEL_STATUS.APPROVED) {
    bodyContent += `
      <div style="padding:12px;background:#D1FAE5;border-radius:8px;font-size:13px;color:#065F46;">
        <i class="fa-solid fa-shield-halved"></i>
        Panel adalah <strong>Master Color Panel yang hidup</strong>.
        Approved ${Utils.formatDateTime(panel.approved_at)} oleh ${Utils.escapeHtml(DB.getUser(panel.approved_by)?.full_name || panel.approved_by)}.
      </div>
    `;
  } else if (panel.status === MCP_PANEL_STATUS.OBSOLETE) {
    bodyContent += `
      <div style="padding:12px;background:var(--color-gray-100);border-radius:8px;font-size:13px;color:var(--color-gray-700);">
        <i class="fa-solid fa-box-archive"></i>
        Panel OBSOLETE. ${panel.obsolete_reason ? `Alasan: ${Utils.escapeHtml(panel.obsolete_reason)}` : ''}
      </div>
    `;
  }

  Utils.setHtml('modalContainer', `
    <div class="modal-overlay">
      <div class="modal-box">
        <div class="modal-header">
          <h3 style="margin:0;font-size:16px;font-weight:700;">
            Slot #${String(panelNumber).padStart(2, '0')} — ${Utils.escapeHtml(panel.panel_id)}
          </h3>
          <button class="btn btn-secondary btn-icon" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body">${bodyContent}</div>
        <div class="modal-footer">${footerButtons}</div>
      </div>
    </div>
  `);

  const fInput = Utils.el('fPhotos');
  if (fInput) fInput.addEventListener('change', handlePhotoSelect);

  if (panel.status !== MCP_PANEL_STATUS.BLANK) {
    setTimeout(() => {
      const qrText = JSON.stringify({
        type: 'MCP', panel_id: panel.panel_id, token: panel.qr_token
      });
      Sticker.renderQrTo('qrPreview', qrText, 120);
    }, 50);
  }
}

async function printSticker() {
  Utils.toastInfo('Generating stiker PDF...');
  await Sticker.generatePanelSticker('MCP', currentMcpId, currentPanelNumber);
  Utils.toastSuccess('Stiker di-download');
}

async function printBulkStickers() {
  const items = DB.filter('mcp_items', p => p.mcp_id === currentMcpId);
  Utils.confirm('Cetak Bulk Stiker?',
    `Akan menghasilkan PDF berisi ${items.length} stiker (${items.length} halaman A6).`,
    'Ya, cetak').then(async r => {
    if (!r.isConfirmed) return;
    Utils.toastInfo('Generating PDF...');
    await Sticker.generateBulkStickers('MCP', currentMcpId);
    Utils.toastSuccess('Bulk stiker di-download');
  });
}

function closeModal() {
  Utils.setHtml('modalContainer', '');
  stagedPhotos = [];
  currentPanelNumber = null;
}

async function handlePhotoSelect(e) {
  const files = Array.from(e.target.files);
  for (const f of files) {
    const v = Utils.validateImageFile(f);
    if (!v.valid) { Utils.toastError(`${f.name}: ${v.msg}`); continue; }
    const base64 = await Utils.fileToBase64(f);
    stagedPhotos.push({ name: f.name, base64: base64 });
  }
  renderStagedPreview();
  e.target.value = '';
}

function renderStagedPreview() {
  const container = Utils.el('stagedPreview');
  if (!container) return;
  if (stagedPhotos.length === 0) { container.innerHTML = ''; return; }
  container.innerHTML = `
    <div class="form-label mt-4">Foto siap upload (${stagedPhotos.length})</div>
    <div class="photo-preview-grid">
      ${stagedPhotos.map((p, i) => `
        <div class="photo-preview-item">
          <img src="${p.base64}" alt="${Utils.escapeHtml(p.name)}">
          <button class="photo-preview-remove" onclick="removeStaged(${i})"><i class="fa-solid fa-xmark"></i></button>
        </div>
      `).join('')}
    </div>
  `;
}
function removeStaged(idx) { stagedPhotos.splice(idx, 1); renderStagedPreview(); }

/* ============================================================
 * ACTIONS
 * ============================================================ */
function doStartBlank() {
  const mfgDate = Utils.el('fMfgDate').value;
  if (!mfgDate) return Utils.toastWarning('Tanggal wajib diisi');
  const res = Biz.startBlankMcpSlot(currentMcpId, currentPanelNumber, mfgDate);
  if (!res.ok) return Utils.alertError('Gagal', res.msg);
  Utils.toastSuccess('Slot dimulai — siap submit');
  closeModal();
  render();
}

function doSubmit() {
  if (stagedPhotos.length < CONFIG.MIN_PHOTO_PER_PANEL) {
    return Utils.toastWarning(`Minimal ${CONFIG.MIN_PHOTO_PER_PANEL} foto`);
  }
  const res = Biz.submitMcpPanel(currentMcpId, currentPanelNumber, stagedPhotos);
  if (!res.ok) return Utils.alertError('Gagal Submit', res.msg);
  Utils.toastSuccess(`${stagedPhotos.length} foto disimpan ke DMS ZMCP`);
  closeModal();
  render();
}

function doApprove() {
  Utils.confirm('Approve Panel MCP?',
    'Panel akan resmi menjadi MCP-APPROVED (master hidup).', 'Ya, approve').then(r => {
    if (!r.isConfirmed) return;
    const res = Biz.approveMcpPanel(currentMcpId, currentPanelNumber);
    if (!res.ok) return Utils.alertError('Gagal Approve', res.msg);
    Utils.toastSuccess('Panel MCP approved');
    closeModal();
    render();
  });
}

function doReject() {
  Utils.prompt('Reject Panel?',
    'Alasan reject (foto kurang jelas, dll)...', 'Alasan').then(r => {
    if (!r.isConfirmed || !r.value) return;
    const res = Biz.rejectMcpPanel(currentMcpId, currentPanelNumber, r.value);
    if (!res.ok) return Utils.alertError('Gagal Reject', res.msg);
    Utils.toastSuccess('Panel dikembalikan, foto dihapus, siap submit ulang');
    closeModal();
    render();
  });
}

function closeHeader() {
  const items = DB.filter('mcp_items', p => p.mcp_id === currentMcpId);
  const approved = items.filter(p => p.status === MCP_PANEL_STATUS.APPROVED).length;
  const willObsolete = items.filter(p =>
    p.status !== MCP_PANEL_STATUS.APPROVED &&
    p.status !== MCP_PANEL_STATUS.OBSOLETE).length;

  Utils.confirm(
    'Close MCP?',
    `${approved} panel akan hidup sebagai Master Color Panel.\n${willObsolete} panel lain akan menjadi OBSOLETE.\n\nLanjutkan?`,
    'Ya, close'
  ).then(r => {
    if (!r.isConfirmed) return;
    const res = Biz.closeMcpHeader(currentMcpId);
    if (!res.ok) return Utils.alertError('Gagal Close', res.msg);
    Utils.alertSuccess('MCP Released', `${res.approved} panel hidup sebagai master.`).then(render);
  });
}
</script>

<div id="modalContainer"></div>

</body>
