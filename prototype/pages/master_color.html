<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Color Code &mdash; Color Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<div class="app-layout">

  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="page-header" id="page-header"></div>

    <div class="page-content">

      <!-- Info card -->
      <div class="card mb-4" style="background:linear-gradient(135deg, #1E3A8A 0%, #3B4E9E 100%);color:#fff;border:none;">
        <div class="card-body" style="display:flex;align-items:center;gap:16px;">
          <div style="width:48px;height:48px;background:rgba(255,255,255,0.15);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;">
            <i class="fa-solid fa-circle-info"></i>
          </div>
          <div style="flex:1;">
            <div style="font-weight:700;font-size:14px;margin-bottom:2px;">Color Code = Entitas Info</div>
            <div style="font-size:12px;opacity:0.85;line-height:1.5;">
              Color Code adalah rujukan warna (1:1 dengan FERT Material). Tidak memiliki panel fisik.
              Otomatis dibuat saat Admin approve Request-DCP untuk material yang belum punya Color Code.
            </div>
          </div>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="card mb-4">
        <div class="card-body" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
          <div style="flex:1;min-width:220px;">
            <input type="text" id="searchInput" class="form-control"
              placeholder="Cari kode, material, nama warna, atau buyer...">
          </div>
          <select id="filterStatus" class="form-control" style="max-width:160px;">
            <option value="">Semua Status</option>
            <option value="A">Active</option>
            <option value="I">Inactive</option>
            <option value="O">Obsolete</option>
          </select>
          <select id="filterBuyer" class="form-control" style="max-width:220px;">
            <option value="">Semua Buyer</option>
          </select>
        </div>
      </div>

      <!-- Table -->
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">
            <i class="fa-solid fa-palette"></i>
            Daftar Color Code
          </h3>
          <span class="text-muted text-sm" id="totalInfo"></span>
        </div>
        <div id="tableWrap">
          <div class="table-empty"><i class="fa-solid fa-spinner fa-spin"></i> Memuat...</div>
        </div>
      </div>

    </div>
  </main>

</div>

<!-- Modal (Edit metadata only — color code + matnr readonly) -->
<div id="modalForm" class="hidden" style="position:fixed;inset:0;background:rgba(15,23,42,0.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#fff;border-radius:12px;max-width:640px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
    <div style="padding:20px 24px;border-bottom:1px solid var(--color-gray-200);display:flex;justify-content:space-between;align-items:center;">
      <h3 style="margin:0;font-size:16px;font-weight:700;" id="modalTitle">Edit Color Code</h3>
      <button class="btn btn-secondary btn-icon" onclick="closeModal()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div style="padding:24px;">

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Color Code</label>
          <input type="text" id="fColorCode" class="form-control text-mono" readonly>
          <div class="form-help">Auto-generate, tidak bisa diubah</div>
        </div>
        <div class="form-group">
          <label class="form-label">Material (FERT)</label>
          <input type="text" id="fMatnr" class="form-control text-mono" readonly>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Deskripsi Material</label>
        <input type="text" id="fMaktx" class="form-control" readonly>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label form-label-required">Nama Warna</label>
          <input type="text" id="fColorName" class="form-control" maxlength="60">
        </div>
        <div class="form-group">
          <label class="form-label">Kode Hex Warna</label>
          <div style="display:flex;gap:8px;align-items:center;">
            <input type="color" id="fColorHexPicker" style="width:44px;height:38px;border:1px solid var(--color-gray-300);border-radius:8px;padding:2px;cursor:pointer;">
            <input type="text" id="fColorHex" class="form-control text-mono" maxlength="7" placeholder="#FFFFFF" style="flex:1;">
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Komponen</label>
          <input type="text" id="fComponent" class="form-control" maxlength="40" placeholder="solid, veneer, dll">
        </div>
        <div class="form-group">
          <label class="form-label form-label-required">Status</label>
          <select id="fStatus" class="form-control">
            <option value="A">Active</option>
            <option value="I">Inactive</option>
            <option value="O">Obsolete</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Buyer</label>
        <input type="text" id="fBuyerName" class="form-control" readonly>
      </div>

      <div class="form-group">
        <label class="form-label">Catatan</label>
        <textarea id="fRemarks" class="form-control" maxlength="200"></textarea>
      </div>

    </div>
    <div style="padding:16px 24px;border-top:1px solid var(--color-gray-200);background:var(--color-gray-50);display:flex;justify-content:flex-end;gap:8px;">
      <button class="btn btn-secondary" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" onclick="saveColor()">
        <i class="fa-solid fa-check"></i>
        <span>Simpan</span>
      </button>
    </div>
  </div>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/utils.js"></script>
<script src="../assets/js/db.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/sidebar.js"></script>
<script>

let editingColorCode = null;

if (Auth.guard([ROLES.ADMIN, ROLES.IT, ROLES.QC])) {
  Sidebar.render();
  Sidebar.renderHeader('Master Color Code', 'Daftar kode warna (1:1 dengan FERT Material)');

  populateBuyerFilter();
  renderTable();

  Utils.el('searchInput').addEventListener('input', Utils.debounce(renderTable, 200));
  Utils.el('filterStatus').addEventListener('change', renderTable);
  Utils.el('filterBuyer').addEventListener('change', renderTable);

  /* Sync color picker with hex text */
  Utils.el('fColorHexPicker').addEventListener('input', function () {
    Utils.el('fColorHex').value = this.value.toUpperCase();
  });
  Utils.el('fColorHex').addEventListener('input', function () {
    const v = this.value;
    if (/^#[0-9A-Fa-f]{6}$/.test(v)) Utils.el('fColorHexPicker').value = v;
  });
}

function populateBuyerFilter() {
  const buyers = DB.all('buyers');
  let opts = '<option value="">Semua Buyer</option>';
  for (const b of buyers) {
    opts += `<option value="${Utils.escapeHtml(b.buyer_id)}">${Utils.escapeHtml(b.buyer_name)}</option>`;
  }
  Utils.el('filterBuyer').innerHTML = opts;
}

function renderTable() {
  const q = Utils.el('searchInput').value.toLowerCase().trim();
  const filterStatus = Utils.el('filterStatus').value;
  const filterBuyer = Utils.el('filterBuyer').value;

  let colors = DB.all('color_codes');

  if (q) {
    colors = colors.filter(c =>
      (c.color_code || '').toLowerCase().includes(q) ||
      (c.matnr || '').toLowerCase().includes(q) ||
      (c.maktx || '').toLowerCase().includes(q) ||
      (c.color_name || '').toLowerCase().includes(q) ||
      DB.getBuyerName(c.buyer_id).toLowerCase().includes(q)
    );
  }
  if (filterStatus) colors = colors.filter(c => c.status === filterStatus);
  if (filterBuyer) colors = colors.filter(c => c.buyer_id === filterBuyer);

  colors.sort((a, b) => (a.color_code || '').localeCompare(b.color_code || ''));

  Utils.setText('totalInfo', `${colors.length} color code`);

  if (colors.length === 0) {
    Utils.setHtml('tableWrap', `
      <div class="empty-state">
        <div class="empty-state-icon"><i class="fa-solid fa-palette"></i></div>
        <div class="empty-state-title">Belum ada Color Code</div>
        <div class="empty-state-text">
          Color Code otomatis dibuat saat Admin approve Request-DCP.<br>
          Belum ada Request yang di-approve, jadi belum ada Color Code.
        </div>
      </div>
    `);
    return;
  }

  const statusLabel = { A: 'Active', I: 'Inactive', O: 'Obsolete' };
  const statusBadge = { A: 'badge-success', I: 'badge-neutral', O: 'badge-danger' };

  let rows = '';
  for (const c of colors) {
    const buyerName = DB.getBuyerName(c.buyer_id);
    const hex = c.color_hex || '#E2E8F0';
    const status = c.status || 'A';

    rows += `
      <tr>
        <td>
          <div style="display:flex;align-items:center;gap:10px;">
            <span class="color-swatch" style="background:${Utils.escapeHtml(hex)};width:28px;height:28px;"></span>
            <div>
              <div class="text-mono" style="font-weight:700;">${Utils.escapeHtml(c.color_code)}</div>
              <div class="text-sm text-muted">${Utils.escapeHtml(c.color_name || '-')}</div>
            </div>
          </div>
        </td>
        <td class="text-mono text-sm">${Utils.escapeHtml(c.matnr)}</td>
        <td class="text-sm">${Utils.escapeHtml(c.maktx || '-')}</td>
        <td class="text-sm">${Utils.escapeHtml(buyerName)}</td>
        <td class="text-sm">${Utils.escapeHtml(c.component || '-')}</td>
        <td>
          <span class="badge ${statusBadge[status]}">${statusLabel[status] || status}</span>
        </td>
        <td class="text-sm text-muted">${Utils.formatDate(c.created_at)}</td>
        <td class="text-right">
          <button class="btn btn-secondary btn-sm" onclick="openEditModal('${Utils.escapeHtml(c.color_code)}')" title="Edit metadata">
            <i class="fa-solid fa-pen"></i>
          </button>
        </td>
      </tr>
    `;
  }

  Utils.setHtml('tableWrap', `
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>Color Code</th>
            <th>Material (FERT)</th>
            <th>Deskripsi</th>
            <th>Buyer</th>
            <th>Komponen</th>
            <th>Status</th>
            <th>Dibuat</th>
            <th class="text-right">Aksi</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `);
}

/* ============================================================
 * EDIT (metadata only)
 * ============================================================ */
function openEditModal(colorCode) {
  const c = DB.find('color_codes', 'color_code', colorCode);
  if (!c) return;
  editingColorCode = colorCode;

  Utils.setText('modalTitle', `Edit ${colorCode}`);
  Utils.el('fColorCode').value = c.color_code;
  Utils.el('fMatnr').value = c.matnr;
  Utils.el('fMaktx').value = c.maktx || '';
  Utils.el('fColorName').value = c.color_name || '';
  Utils.el('fColorHex').value = c.color_hex || '#E2E8F0';
  Utils.el('fColorHexPicker').value = c.color_hex || '#E2E8F0';
  Utils.el('fComponent').value = c.component || '';
  Utils.el('fStatus').value = c.status || 'A';
  Utils.el('fBuyerName').value = DB.getBuyerName(c.buyer_id);
  Utils.el('fRemarks').value = c.remarks || '';

  Utils.show('modalForm');
}

function closeModal() {
  Utils.hide('modalForm');
  editingColorCode = null;
}

function saveColor() {
  const colorName = Utils.el('fColorName').value.trim();
  const colorHex = Utils.el('fColorHex').value.trim();
  const component = Utils.el('fComponent').value.trim();
  const status = Utils.el('fStatus').value;
  const remarks = Utils.el('fRemarks').value.trim();

  if (!colorName) return Utils.toastWarning('Nama Warna wajib diisi');
  if (colorHex && !/^#[0-9A-Fa-f]{6}$/.test(colorHex)) {
    return Utils.toastWarning('Kode hex tidak valid (contoh: #FF5733)');
  }

  const old = DB.find('color_codes', 'color_code', editingColorCode);
  DB.update('color_codes', 'color_code', editingColorCode, {
    color_name: colorName,
    color_hex: colorHex.toUpperCase(),
    component: component,
    status: status,
    remarks: remarks,
    changed_at: Utils.now(),
    changed_by: Auth.getSession().user_id,
  });
  DB.audit('COLOR', editingColorCode, 'UPDATE',
    `Update color code ${editingColorCode}`,
    `name=${old.color_name}, status=${old.status}`,
    `name=${colorName}, status=${status}`);
  Utils.toastSuccess('Color Code diperbarui');
  closeModal();
  renderTable();
}

</script>
</body>
</html>
